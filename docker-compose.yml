services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    ports:
      - '127.0.0.1:${MONGO_PORT:-27018}:27017'
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', 'db.adminCommand("ping").ok']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      PORT: ${PORT:-4000}
      MONGODB_URI: ${MONGODB_URI_DOCKER:-mongodb://mongo:27017/q65_online_exam}
      CORS_ORIGIN: ${CORS_ORIGIN_DOCKER:-http://localhost:8080}
      DEMO_STUDENT_NUMBER: ${DEMO_STUDENT_NUMBER:-Q65-DEMO-001}
      DEMO_STUDENT_PASSWORD: ${DEMO_STUDENT_PASSWORD:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-false}
      NODE_ENV: production
    command: ['sh', '-c', 'npm run seed && exec npm start']
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', 'fetch("http://127.0.0.1:" + process.env.PORT + "/api/health").then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    ports:
      - '${FRONTEND_PORT:-8080}:80'
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo_data: